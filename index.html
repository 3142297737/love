<main class="page" id="page">
  <canvas id="scene" aria-hidden="true"></canvas>
  <header><p class="eyebrow">A LITTLE LOVE, JUST FOR YOU</p><p class="dedication">写给刘娜的偏爱</p></header>
  <section class="intro" id="intro" aria-label="打开这份心意">
    <h1>刘娜，<br>有些话想对你说。</h1>
    <p>把想念写成小纸条，<br>把每一张，都放进心里。</p>
    <button class="start" id="start">点开我的心意 <span aria-hidden="true">♡</span></button>
    <p class="small">给独一无二的你</p>
  </section>
  <div class="center" id="center"><p class="overline">每一句，都是你</p><h2>刘娜，我爱你</h2><p class="under">往后的四季，都想有你</p></div>
  <section class="bottom" id="bottom" aria-label="便签和播放控制" inert>
    <button class="message" id="message" aria-label="下一句心意">遇见你，真好</button>

  </section>
  <p class="footnote">想把平凡的日子，过成有你的日子</p>
  <p class="sr-only" id="description">打开后，写着祝福和告白的彩色便签会聚成爱心，再散开、重新聚拢并保持心形。可以暂停动画，或点击下方文字逐句阅读。</p>

function syncMusic(rewind=false){
 const request=++musicRequest;
 if(rewind){try{music.currentTime=0;}catch(error){/* 音频首次加载时由浏览器从头播放 */}}
 if(!started||!musicEnabled||paused||document.hidden){music.pause();refreshMusicButton();return;}
 if(music.ended&&!rewind){refreshMusicButton();return;}
 musicBlocked=false;refreshMusicButton();
 try{
   const playback=music.play();
   if(playback&&playback.then)playback.then(()=>{
     if(!musicEnabled||paused||document.hidden)music.pause();
     if(request===musicRequest)refreshMusicButton();
   }).catch(()=>{if(request===musicRequest){musicBlocked=true;refreshMusicButton();}});
 }catch(error){musicBlocked=true;refreshMusicButton();}

   const rewind=music.ended;
   musicEnabled=rewind||musicBlocked?true:!musicEnabled;
   syncMusic(rewind);

}
const trace=outline(240);
const smooth=t=>{t=Math.max(0,Math.min(1,t));return t*t*t*(t*(6*t-15)+10);};
function layout(){
 W=page.clientWidth;H=page.clientHeight;const dpr=Math.min(window.devicePixelRatio||1,2);
 canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
 cx=W/2;cy=H*.43;scale=Math.min((W-64)/32,(H*.48)/29,20);
 cardW=Math.max(27,Math.min(61,W*.091));cardH=cardW*.52;
 const outer=W<600?54:72,inner=W<600?38:54;
 notes=[];const targets=[...outline(outer).map(p=>[p[0],p[1],1]),...outline(inner).map(p=>[p[0],p[1],.79])];
 const columns=Math.max(5,Math.floor(W/(cardW*1.15))),rows=Math.ceil(targets.length/columns);
 const slots=Array.from({length:columns*rows},(_,i)=>i);
 for(let i=slots.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[slots[i],slots[j]]=[slots[j],slots[i]];}
 targets.forEach((p,i)=>{
   const theta=Math.random()*Math.PI*2,slot=slots[i];
   const tx=cx+p[0]*scale*p[2],ty=cy+p[1]*scale*p[2];
   const sx=cx+Math.cos(theta)*(W+H)*.7,sy=cy+Math.sin(theta)*(W+H)*.7;
   notes.push({tx,ty,x:sx,y:sy,ox:sx,oy:sy,sx,sy,
     scatterDelay:i<outer ? .3*i/Math.max(1,outer-1) : .4+.3*(i-outer)/Math.max(1,inner-1),
     scatterTilt:0,spinDirection:i%2===0?1:-1,
     dx:(slot%columns+.5)*W/columns,dy:110+(Math.floor(slot/columns)+.5)*(H-310)/rows,
     color:COLORS[i%COLORS.length],text:TEXTS[i%TEXTS.length],angle:(Math.random()-.5)*.22,bend:(Math.random()-.5)*Math.min(W,500),offset:Math.random()*6.28});
 });
 stars=Array.from({length:48},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.3,o:Math.random()*6.28}));
 if(started){setPhase(reduced.matches||phase==='final'?'final':'enter');}else{notes.forEach(n=>{n.x=n.tx;n.y=n.ty;});}
 draw();
}
function setPhase(next){phase=next;phaseTime=0;notes.forEach(n=>{n.scatterTilt=0;if(next==='final'){n.x=n.tx;n.y=n.ty;}n.ox=n.x;n.oy=n.y;});center.classList.toggle('visible',next==='hold'||next==='final');pauseButton.hidden=reduced.matches||next==='final';}
function nextMessage(){messageIndex=(messageIndex+1)%TEXTS.length;message.textContent=TEXTS[messageIndex];messageClock=0;}
function update(dt){
 elapsed+=dt;
 if(!started||paused)return;
 phaseTime+=dt;messageClock+=dt;
 if(messageClock>4.5&&!reduced.matches)nextMessage();
 const duration={enter:6.2,hold:1.8,scatter:3.4,float:4,return:3.9};
 notes.forEach((n,i)=>{
   if(reduced.matches){n.x=n.tx;n.y=n.ty;return;}
   if(phase==='final'){n.x=n.tx;n.y=n.ty;return;}
   if(phase==='hold'){
     const pulse=1+.009*Math.sin(phaseTime*2);n.x=cx+(n.tx-cx)*pulse;n.y=cy+(n.ty-cy)*pulse;return;
   }
   if(phase==='float'){n.x=n.dx+Math.sin(phaseTime+n.offset)*3;n.y=n.dy+Math.cos(phaseTime+n.offset)*4;return;}
   let p=0,tx=n.tx,ty=n.ty;
   if(phase==='enter')p=smooth((phaseTime-i/(notes.length-1)*3.4)/2.6);
   if(phase==='scatter'){
     // 外层先沿轮廓依次起飞，内层随后跟上；总时长仍为 3.4 秒。
     p=smooth((phaseTime-n.scatterDelay)/2.7);tx=n.dx;ty=n.dy;
     // 轻轻翻摆，在起点和落点归零，避免切换阶段时角度跳变。
     const flutter=Math.sin(p*Math.PI)**2;
     n.scatterTilt=flutter*(n.spinDirection*.16+Math.sin(p*Math.PI*2)*.1);
   }
   if(phase==='return')p=smooth((phaseTime-(i%9)*.07)/3.2);
   const arc=Math.sin(p*Math.PI)*n.bend;
   n.x=n.ox+(tx-n.ox)*p+arc*.25;n.y=n.oy+(ty-n.oy)*p+arc;
 });
 if(!reduced.matches&&phaseTime>=duration[phase])setPhase({enter:'hold',hold:'scatter',scatter:'float',float:'return',return:'final'}[phase]);
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function draw(){
 ctx.clearRect(0,0,W,H);
 stars.forEach(s=>{ctx.globalAlpha=.18+.35*(1+Math.sin((reduced.matches?0:elapsed)*.6+s.o))/2;ctx.fillStyle='#eac4d5';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});
 ctx.globalAlpha=1;
 if(phase==='hold'||phase==='final'||!started){
   ctx.save();ctx.strokeStyle='#cf829c';ctx.globalAlpha=started?.25:.10;ctx.lineWidth=1;
   [1.04,.74].forEach(f=>{ctx.beginPath();trace.forEach((p,i)=>{const x=cx+p[0]*scale*f,y=cy+p[1]*scale*f;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.closePath();ctx.stroke();});ctx.restore();
 }
 ctx.globalAlpha=started?1:.18;
 notes.forEach(n=>{
   if(n.x < -cardW||n.x>W+cardW||n.y < -cardH||n.y>H+cardH)return;
   ctx.save();ctx.translate(n.x,n.y);ctx.rotate(n.angle+n.scatterTilt);
   ctx.fillStyle='#09040d55';roundRect(-cardW/2+1,-cardH/2+2,cardW,cardH,2);ctx.fill();
   ctx.fillStyle=n.color;roundRect(-cardW/2,-cardH/2,cardW,cardH,2);ctx.fill();
   ctx.fillStyle='#ffffff70';ctx.fillRect(-cardW/2+3,-cardH/2+2,cardW-6,1);
   // 小便签是组成爱心的视觉元素；下方同步提供可阅读的大字文案。
   const font=cardW*.155;ctx.font=`${font}px "PingFang SC","Microsoft YaHei",sans-serif`;ctx.fillStyle='#503443';ctx.textAlign='center';ctx.textBaseline='middle';
   const chars=Array.from(n.text),limit=6;
   if(chars.length>limit){ctx.fillText(chars.slice(0,limit).join(''),0,-font*.58);ctx.fillText(chars.slice(limit).join(''),0,font*.68);}
   else ctx.fillText(n.text,0,1);
   ctx.restore();
 });
 ctx.globalAlpha=1;
}
function tick(now){frameId=0;const dt=last?Math.min((now-last)/1000,.05):0;last=now;update(dt);draw();if(!document.hidden&&!paused&&!reduced.matches)frameId=requestAnimationFrame(tick);}
function ensureLoop(){if(!frameId&&!document.hidden&&!paused){last=0;frameId=requestAnimationFrame(tick);}}
function start(){
 started=true;paused=false;page.classList.add('started');document.getElementById('intro').inert=true;document.getElementById('bottom').inert=false;
 notes.forEach(n=>{n.x=n.sx;n.y=n.sy;});setPhase(reduced.matches?'final':'enter');
 messageIndex=20;message.textContent=TEXTS[messageIndex];messageClock=0;pauseButton.textContent='暂停';pauseButton.setAttribute('aria-pressed','false');
 pauseButton.hidden=reduced.matches;syncMusic(true);ensureLoop();message.focus({preventScroll:true});
}
document.getElementById('start').addEventListener('click',start);
document.getElementById('replay').addEventListener('click',start);
message.addEventListener('click',nextMessage);
pauseButton.addEventListener('click',()=>{paused=!paused;pauseButton.textContent=paused?'继续':'暂停';pauseButton.setAttribute('aria-pressed',String(paused));syncMusic();if(paused){cancelAnimationFrame(frameId);frameId=0;}else ensureLoop();});
canvas.addEventListener('click',e=>{if(!started)return;const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;for(let i=notes.length-1;i>=0;i--){const n=notes[i];if(Math.abs(x-n.x)<cardW*.65&&Math.abs(y-n.y)<cardH*.8){messageIndex=TEXTS.indexOf(n.text);message.textContent=n.text;messageClock=0;break;}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(frameId);frameId=0;last=0;}else ensureLoop();syncMusic();});
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{layout();if(reduced.matches&&started)update(0);draw();ensureLoop();},180);});
function motionChanged(){pauseButton.hidden=reduced.matches;if(started){paused=false;pauseButton.textContent='暂停';pauseButton.setAttribute('aria-pressed','false');setPhase('final');update(0);draw();syncMusic();}ensureLoop();}
if(reduced.addEventListener)reduced.addEventListener('change',motionChanged);else reduced.addListener(motionChanged);
layout();ensureLoop();
</script>
</body>
</html>
